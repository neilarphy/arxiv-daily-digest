[project]
name = "arxiv-daily-digest"
description = "daily digest of relevant papers"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]
eda = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pymupdf>=2.0",
    "tiktoken>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E","W","F","I","UP","B"]
