[project]
name = "arxiv-daily-digest"
description = "daily digest of relevant papers"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E","W","F","I","UP","B"]
